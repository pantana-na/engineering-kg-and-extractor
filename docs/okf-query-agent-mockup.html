<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OKF Query Agent — Engineering Knowledge Graph, Vector RRF &amp; HAZOP Workbench</title>
  <meta name="description" content="Interactive executive demo workbench for the Engineering Open Knowledge Format (OKF) Spanner Graph-RAG Query Agent featuring Knowledge Catalog, ISO GQL Graph, 768-d Vector RRF Search, HAZOP Risk Assessment, Blast Radius, and PDF Data Lineage." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       DESIGN SYSTEM TOKENS — CRISP ENTERPRISE LIGHT & DARK INDUSTRIAL BLUEPRINT
       Zero purple-on-dark, curated HSL/hex engineering palette, tabular numerals
       ========================================================================== */
    :root,
    [data-theme="light"] {
      --bg-canvas: #f4f6f9;
      --bg-surface: #ffffff;
      --bg-elevated: #f8fafc;
      --bg-subtle: #eef2f6;
      --bg-hover: #f1f5f9;
      --bg-graph: #f8fafc;
      --bg-graph-dots: #cbd5e1;

      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-faint: #94a3b8;

      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --border-focus: #1d4ed8;

      --brand-primary: #1d4ed8;
      --brand-primary-hover: #1e40af;
      --brand-primary-soft: #eff6ff;
      --brand-primary-border: #bfdbfe;

      --accent-teal: #0f766e;
      --accent-teal-soft: #f0fdfa;
      --accent-teal-border: #99f6e4;

      --accent-amber: #b45309;
      --accent-amber-soft: #fffbeb;
      --accent-amber-border: #fde68a;

      --accent-slate: #334155;
      --accent-slate-soft: #f1f5f9;

      /* Semantic HAZOP RAC 1–4 & Safety Colors */
      --rac1-bg: #fef2f2;
      --rac1-text: #b91c1c;
      --rac1-border: #fecaca;
      --rac1-solid: #dc2626;

      --rac2-bg: #fff7ed;
      --rac2-text: #c2410c;
      --rac2-border: #fed7aa;
      --rac2-solid: #ea580c;

      --rac3-bg: #fefce8;
      --rac3-text: #a16207;
      --rac3-border: #fef08a;
      --rac3-solid: #ca8a04;

      --rac4-bg: #f0fdf4;
      --rac4-text: #15803d;
      --rac4-border: #bbf7d0;
      --rac4-solid: #16a34a;

      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);

      --font-display: "Plus Jakarta Sans", "Inter", -apple-system, sans-serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;

      --radius-xs: 5px;
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    [data-theme="dark"] {
      --bg-canvas: #090d16;
      --bg-surface: #0f1623;
      --bg-elevated: #162032;
      --bg-subtle: #1e293b;
      --bg-hover: #1c283c;
      --bg-graph: #0b111d;
      --bg-graph-dots: #1e293b;

      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-faint: #64748b;

      --border-subtle: #1e293b;
      --border-strong: #334155;
      --border-focus: #38bdf8;

      --brand-primary: #0284c7;
      --brand-primary-hover: #0369a1;
      --brand-primary-soft: rgba(56, 189, 248, 0.13);
      --brand-primary-border: rgba(56, 189, 248, 0.32);

      --accent-teal: #2dd4bf;
      --accent-teal-soft: rgba(45, 212, 191, 0.12);
      --accent-teal-border: rgba(45, 212, 191, 0.3);

      --accent-amber: #fbbf24;
      --accent-amber-soft: rgba(245, 158, 11, 0.14);
      --accent-amber-border: rgba(245, 158, 11, 0.35);

      --accent-slate: #cbd5e1;
      --accent-slate-soft: #1e293b;

      --rac1-bg: rgba(220, 38, 38, 0.16);
      --rac1-text: #fca5a5;
      --rac1-border: rgba(248, 113, 113, 0.38);
      --rac1-solid: #ef4444;

      --rac2-bg: rgba(234, 88, 12, 0.16);
      --rac2-text: #fdba74;
      --rac2-border: rgba(251, 146, 60, 0.38);
      --rac2-solid: #f97316;

      --rac3-bg: rgba(202, 138, 4, 0.16);
      --rac3-text: #fde047;
      --rac3-border: rgba(250, 204, 21, 0.36);
      --rac3-solid: #eab308;

      --rac4-bg: rgba(22, 163, 74, 0.16);
      --rac4-text: #86efac;
      --rac4-border: rgba(74, 222, 128, 0.35);
      --rac4-solid: #22c55e;

      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.38);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.5);
    }

    [data-theme="dark"] .brand-text-accent {
      color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.5;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    code,
    pre,
    kbd,
    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
    }

    /* ==========================================================================
       TOP EXECUTIVE HEADER (56px)
       ========================================================================== */
    .app-header {
      height: 56px;
      padding: 0 18px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 30;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .btn-icon-toggle {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-icon-toggle:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--brand-primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--shadow-xs);
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title-row h1 {
      font-family: var(--font-display);
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .arch-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
      background: var(--brand-primary-soft);
      color: var(--brand-primary);
      border: 1px solid var(--brand-primary-border);
      white-space: nowrap;
    }
    [data-theme="dark"] .arch-pill {
      color: #38bdf8;
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .context-focus-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--rac4-solid);
    }

    .hdr-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .hdr-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    /* ==========================================================================
       MAIN SPLIT STUDIO WORKSPACE
       ========================================================================== */
    .studio-shell {
      height: calc(100vh - 56px);
      display: flex;
      width: 100%;
      overflow: hidden;
    }

    /* 1. COLLAPSIBLE LEFT ASSET & CONCEPT RAIL */
    .asset-rail {
      width: 262px;
      min-width: 262px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                  min-width 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.18s ease;
      overflow: hidden;
    }

    .asset-rail.collapsed {
      width: 0;
      min-width: 0;
      border-right-color: transparent;
      opacity: 0;
      pointer-events: none;
    }

    .rail-top {
      padding: 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rail-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rail-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .rail-search {
      width: 100%;
      padding: 7px 10px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .rail-search:focus {
      border-color: var(--border-focus);
      background: var(--bg-surface);
    }

    .rail-mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 3px;
      background: var(--bg-subtle);
      border-radius: var(--radius-xs);
    }

    .rail-mode-btn {
      padding: 5px 8px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .rail-mode-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-xs);
    }

    .rail-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .unit-section-title {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0 4px 5px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .asset-item {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: all 0.14s ease;
      margin-bottom: 3px;
    }
    .asset-item:hover {
      background: var(--bg-hover);
    }
    .asset-item.active {
      background: var(--brand-primary-soft);
      border-color: var(--brand-primary-border);
    }

    .asset-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .asset-tag {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .asset-item.active .asset-tag {
      color: var(--brand-primary);
    }
    [data-theme="dark"] .asset-item.active .asset-tag {
      color: #38bdf8;
    }

    .asset-name {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-xs {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      font-family: var(--font-mono);
    }
    .badge-conflict {
      background: var(--accent-amber-soft);
      color: var(--accent-amber);
      border: 1px solid var(--accent-amber-border);
    }
    .badge-neutral {
      background: var(--bg-subtle);
      color: var(--text-muted);
    }

    /* ==========================================================================
       2. CENTER CONVERSATIONAL AGENT PANE
       ========================================================================== */
    .chat-pane {
      flex: 1.08;
      min-width: 420px;
      display: flex;
      flex-direction: column;
      background: var(--bg-canvas);
      border-right: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    /* Quick Demo Scenarios Strip (Always accessible) */
    .scenario-strip {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .scenario-strip-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      white-space: nowrap;
      margin-right: 2px;
    }

    .scenario-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .scenario-pill:hover:not(:disabled) {
      border-color: var(--brand-primary);
      background: var(--brand-primary-soft);
      color: var(--brand-primary);
    }
    [data-theme="dark"] .scenario-pill:hover:not(:disabled) {
      color: #38bdf8;
      border-color: #38bdf8;
    }
    .scenario-pill.active-scenario {
      background: var(--brand-primary);
      border-color: var(--brand-primary);
      color: #ffffff;
    }
    .scenario-pill:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .scenario-num {
      font-family: var(--font-mono);
      font-size: 10px;
      opacity: 0.8;
    }

    /* Scrollable Chat Stream */
    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Welcome Demo Deck */
    .welcome-hero {
      max-width: 760px;
      margin: auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .welcome-header-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      box-shadow: var(--shadow-xs);
    }

    .welcome-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-teal);
      margin-bottom: 6px;
    }

    .welcome-title {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .welcome-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (max-width: 1180px) {
      .demo-grid {
        grid-template-columns: 1fr;
      }
    }

    .demo-card {
      text-align: left;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 13px 15px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow-xs);
    }
    .demo-card:hover {
      transform: translateY(-1px);
      border-color: var(--brand-primary);
      box-shadow: var(--shadow-sm);
    }

    .demo-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .demo-card-cat {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--brand-primary);
      background: var(--brand-primary-soft);
      padding: 2px 7px;
      border-radius: 4px;
    }
    [data-theme="dark"] .demo-card-cat {
      color: #38bdf8;
    }

    .demo-card-target {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .demo-card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .demo-card-prompt {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* User & Agent Messages */
    .msg-user {
      align-self: flex-end;
      max-width: 86%;
      background: var(--brand-primary);
      color: #ffffff;
      padding: 11px 15px;
      border-radius: 14px 14px 3px 14px;
      box-shadow: var(--shadow-xs);
    }

    .msg-user-meta {
      font-size: 10.5px;
      opacity: 0.85;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: var(--font-mono);
    }

    .msg-user-text {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.45;
    }

    .msg-agent-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    /* ==========================================================================
       SIMULATED 4–5s THINKING & LIVE TOOL CALL TIMELINE CARD
       ========================================================================== */
    .thinking-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
    }

    .thinking-progress-track {
      height: 3px;
      width: 100%;
      background: var(--bg-subtle);
      overflow: hidden;
    }

    .thinking-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--brand-primary);
      transition: width 0.15s linear;
    }
    .thinking-card.completed .thinking-progress-fill {
      background: var(--accent-teal);
    }

    .thinking-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      background: var(--bg-elevated);
    }
    .thinking-header:hover {
      background: var(--bg-hover);
    }

    .thinking-header-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .spinner-ring {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid var(--brand-primary-border);
      border-top-color: var(--brand-primary);
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .done-check-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--rac4-bg);
      color: var(--rac4-text);
      border: 1px solid var(--rac4-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .thinking-status-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thinking-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .thinking-timer {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--brand-primary);
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--brand-primary-soft);
    }
    [data-theme="dark"] .thinking-timer {
      color: #38bdf8;
    }
    .thinking-card.completed .thinking-timer {
      background: var(--bg-subtle);
      color: var(--text-secondary);
    }

    .thinking-chevron {
      font-size: 11px;
      color: var(--text-muted);
      transition: transform 0.18s ease;
    }
    .thinking-card.collapsed-trace .thinking-chevron {
      transform: rotate(-90deg);
    }

    .thinking-body {
      padding: 12px 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .thinking-card.collapsed-trace .thinking-body {
      display: none;
    }

    .thought-bubble {
      padding: 9px 12px;
      border-radius: var(--radius-xs);
      background: var(--bg-elevated);
      border-left: 3px solid var(--brand-primary);
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .thought-bubble strong {
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .tool-call-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tool-call-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .tool-call-row.running {
      border-color: var(--brand-primary-border);
      background: var(--brand-primary-soft);
    }
    .tool-call-row.pending {
      opacity: 0.45;
    }

    .tool-call-main {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .tool-call-title-line {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .tool-fn-name {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .tool-engine-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--accent-teal-soft);
      color: var(--accent-teal);
      border: 1px solid var(--accent-teal-border);
    }

    .tool-args-code {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      word-break: break-word;
    }

    .tool-call-status {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .tool-call-row.done .tool-call-status {
      color: var(--rac4-text);
    }

    /* ==========================================================================
       STRUCTURED ENGINEERING ANSWER CARD
       ========================================================================== */
    .answer-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-xs);
      animation: fadeSlideUp 0.28s ease-out;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .answer-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .answer-title-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .answer-badge {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--rac4-bg);
      color: var(--rac4-text);
      border: 1px solid var(--rac4-border);
    }

    .studio-jump-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--brand-primary-border);
      background: var(--brand-primary-soft);
      color: var(--brand-primary);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    [data-theme="dark"] .studio-jump-btn {
      color: #38bdf8;
    }
    .studio-jump-btn:hover {
      background: var(--brand-primary);
      color: #ffffff;
    }

    .ans-body h3 {
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 14px 0 8px 0;
    }
    .ans-body h3:first-child {
      margin-top: 0;
    }

    .ans-body p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      line-height: 1.55;
    }

    .ans-body ul {
      padding-left: 18px;
      margin-bottom: 12px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .ans-body li {
      margin-bottom: 5px;
    }

    /* Engineering Data Tables inside Answers & Studio */
    .eng-table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 10px 0 14px 0;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
    }

    .eng-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }

    .eng-table th {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    .eng-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      vertical-align: top;
    }

    .eng-table tr:last-child td {
      border-bottom: none;
    }

    .eng-table tr:hover td {
      background: var(--bg-hover);
    }

    /* RAC 1–4 Risk Badges */
    .rac-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .rac-1 {
      background: var(--rac1-bg);
      color: var(--rac1-text);
      border: 1px solid var(--rac1-border);
    }
    .rac-2 {
      background: var(--rac2-bg);
      color: var(--rac2-text);
      border: 1px solid var(--rac2-border);
    }
    .rac-3 {
      background: var(--rac3-bg);
      color: var(--rac3-text);
      border: 1px solid var(--rac3-border);
    }
    .rac-4 {
      background: var(--rac4-bg);
      color: var(--rac4-text);
      border: 1px solid var(--rac4-border);
    }

    /* Callout Banners */
    .callout-box {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      line-height: 1.5;
      margin: 10px 0;
    }
    .callout-conflict {
      background: var(--accent-amber-soft);
      border: 1px solid var(--accent-amber-border);
      border-left: 4px solid var(--accent-amber);
      color: var(--text-primary);
    }
    .callout-critical {
      background: var(--rac1-bg);
      border: 1px solid var(--rac1-border);
      border-left: 4px solid var(--rac1-solid);
      color: var(--text-primary);
    }
    .callout-info {
      background: var(--brand-primary-soft);
      border: 1px solid var(--brand-primary-border);
      border-left: 4px solid var(--brand-primary);
      color: var(--text-primary);
    }

    /* Chat Input Footer */
    .chat-composer {
      padding: 12px 18px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .composer-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 6px 8px 6px 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .composer-box:focus-within {
      border-color: var(--border-focus);
      background: var(--bg-surface);
      box-shadow: 0 0 0 3px var(--brand-primary-soft);
    }

    .composer-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      resize: none;
      outline: none;
      min-height: 22px;
      max-height: 80px;
    }

    .btn-send {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--brand-primary);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      flex-shrink: 0;
    }
    .btn-send:hover:not(:disabled) {
      background: var(--brand-primary-hover);
    }
    .btn-send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* ==========================================================================
       3. RIGHT TABBED CONTEXT STUDIO (GRAPH | CATALOG | VECTOR RRF | LINEAGE)
       ========================================================================== */
    .context-studio {
      flex: 1;
      min-width: 440px;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .studio-tabs-bar {
      height: 46px;
      padding: 0 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .studio-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 100%;
    }

    .studio-tab {
      height: 100%;
      padding: 0 12px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .studio-tab:hover {
      color: var(--text-primary);
    }
    .studio-tab.active {
      color: var(--brand-primary);
      border-bottom-color: var(--brand-primary);
    }
    [data-theme="dark"] .studio-tab.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }

    .tab-count {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 999px;
      background: var(--bg-subtle);
      color: var(--text-muted);
    }
    .studio-tab.active .tab-count {
      background: var(--brand-primary-soft);
      color: inherit;
    }

    .studio-panel {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .studio-panel.active {
      display: flex;
    }

    /* --------------------------------------------------------------------------
       TAB 1: KNOWLEDGE GRAPH (OkfKnowledgeGraph ISO GQL)
       -------------------------------------------------------------------------- */
    .graph-toolbar {
      padding: 9px 14px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .seg-group {
      display: inline-flex;
      background: var(--bg-subtle);
      padding: 2px;
      border-radius: var(--radius-xs);
      gap: 2px;
    }

    .seg-btn {
      padding: 4px 9px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-xs);
    }

    .graph-legend-strip {
      padding: 7px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .legend-filters {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .legend-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      font-family: var(--font-mono);
      font-size: 10.5px;
    }

    .dot-swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .graph-stage {
      flex: 1;
      position: relative;
      background-color: var(--bg-graph);
      background-image: radial-gradient(var(--bg-graph-dots) 1px, transparent 1px);
      background-size: 20px 20px;
      overflow: hidden;
      cursor: grab;
    }
    .graph-stage:active {
      cursor: grabbing;
    }

    #okf-graph-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .graph-zoom-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }

    .zoom-btn {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--shadow-xs);
    }
    .zoom-btn:hover {
      background: var(--bg-elevated);
    }

    .graph-inspector-dock {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -24;
      }
    }
    .edge-animated-flow {
      stroke-dasharray: 7 5;
      animation: dashFlow 0.9s linear infinite;
    }

    @keyframes pulseImpact {
      0% {
        r: 22;
        opacity: 0.65;
      }
      100% {
        r: 38;
        opacity: 0;
      }
    }
    .blast-pulse-ring {
      fill: none;
      stroke: var(--rac1-solid);
      stroke-width: 2.5;
      animation: pulseImpact 1.6s ease-out infinite;
    }

    /* --------------------------------------------------------------------------
       TAB 2, 3, 4 SCROLLABLE CONTENT CONTAINERS
       -------------------------------------------------------------------------- */
    .studio-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .studio-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: var(--shadow-xs);
    }

    .studio-card-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .studio-card-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gov-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .gov-cell {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xs);
      padding: 8px 10px;
    }

    .gov-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .gov-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Vector & Hybrid RRF Chunk Cards */
    .vector-search-bar {
      display: flex;
      gap: 8px;
    }

    .chunk-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease;
    }
    .chunk-card:hover {
      border-color: var(--border-strong);
    }

    .score-bars-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--bg-elevated);
      padding: 7px 10px;
      border-radius: var(--radius-xs);
    }

    .score-metric {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .score-metric-top {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
    }

    .score-track {
      height: 5px;
      border-radius: 999px;
      background: var(--bg-subtle);
      overflow: hidden;
    }

    .score-fill-vec {
      height: 100%;
      background: var(--brand-primary);
      border-radius: 999px;
    }
    .score-fill-fts {
      height: 100%;
      background: var(--accent-teal);
      border-radius: 999px;
    }
    .score-fill-rrf {
      height: 100%;
      background: var(--rac4-solid);
      border-radius: 999px;
    }

    /* Lineage 4-Stage Pipeline */
    .lineage-pipeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .pipeline-step {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px;
      position: relative;
    }

    .pipeline-step-num {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--brand-primary);
      margin-bottom: 3px;
    }
    [data-theme="dark"] .pipeline-step-num {
      color: #38bdf8;
    }

    .pipeline-step-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 3px;
    }

    .pipeline-step-meta {
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .studio-shell {
        flex-direction: column;
        overflow-y: auto;
      }
      .chat-pane,
      .context-studio {
        min-width: 100%;
        min-height: 540px;
      }
      .asset-rail {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- ========================================================================
       TOP EXECUTIVE HEADER
       ======================================================================== -->
  <header class="app-header">
    <div class="header-left">
      <button
        type="button"
        class="btn-icon-toggle"
        id="btn-toggle-sidebar"
        title="Toggle Plant Equipment &amp; Standards Explorer"
        aria-label="Toggle Asset Explorer"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M9 3v18" />
        </svg>
      </button>

      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="6" cy="6" r="2.8" />
          <circle cx="18" cy="6" r="2.8" />
          <circle cx="12" cy="18" r="2.8" />
          <path d="M8.6 6.8h6.8M7.4 8.5l3.3 6.8M16.6 8.5l-3.3 6.8" />
        </svg>
      </div>

      <div class="brand-block">
        <div class="brand-title-row">
          <h1>OKF Query Agent</h1>
          <span class="arch-pill">Spanner Graph-RAG • Vector RRF • Dataplex</span>
        </div>
        <div class="brand-sub">
          Seabrook Station Engineering Knowledge Base (OKF v0.2) • Model: <code class="brand-text-accent">gemini-3.8-flash</code>
        </div>
      </div>
    </div>

    <div class="header-right">
      <div class="context-focus-pill" title="Active Equipment or OKF Concept in Context Studio">
        <span class="status-dot-live"></span>
        <span>Active Focus:</span>
        <code id="header-focus-badge" style="font-weight: 700;">RH-E-9A</code>
      </div>

      <button type="button" class="hdr-btn" id="btn-reset-demo" title="Clear conversation and return to Demo Scenario Overview">
        ↺ Reset Demo
      </button>

      <button type="button" class="hdr-btn" id="btn-theme-toggle" aria-label="Switch Theme">
        <span id="theme-toggle-text">🌙 Dark Blueprint</span>
      </button>
    </div>
  </header>

  <!-- ========================================================================
       MAIN SPLIT WORKSPACE
       ======================================================================== -->
  <main class="studio-shell">
    <!-- 1. COLLAPSIBLE LEFT EQUIPMENT & CONCEPT EXPLORER -->

      /* ======================================================================
         10. RIGHT STUDIO TAB 3: 768-D VECTOR + FTS HYBRID RRF INSPECTOR
         ====================================================================== */
      function renderVectorTab() {
        const q = state.vectorFilterQuery.trim().toLowerCase();
        const tokens = q.split(/\s+/).filter((w) => w.length > 2);

        const scoredChunks = VECTOR_CHUNKS.map((c) => {
          if (!tokens.length) return c;
          const hay = `${c.concept} ${c.section} ${c.snippet} ${c.tags.join(" ")}`.toLowerCase();
          let hits = 0;
          tokens.forEach((tk) => {
            if (hay.includes(tk)) hits += 1;
          });
          const boost = Math.min(0.04, hits * 0.008);
          return {
            ...c,
            vecScore: Math.min(0.985, +(c.vecScore + boost * 0.5).toFixed(3)),
            ftsScore: Math.min(0.975, +(c.ftsScore + boost).toFixed(3)),
            rrfScore: +(c.rrfScore + boost * 0.1).toFixed(4),
          };
        }).sort((a, b) => b.rrfScore - a.rrfScore);

        dom.vectorContainer.innerHTML = `
          <div class="studio-card">
            <div class="studio-card-hdr">
              <div class="studio-card-title">🧬 Spanner Hybrid Search (768-d Vector + TOKENLIST RRF)</div>
              <span class="arch-pill">text-embedding-005</span>
            </div>
            <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;">
              Combines semantic dense vector search (<code>COSINE_DISTANCE</code>) with exact alphanumeric tag matching (<code>SEARCH_SUBSTRING</code>) via Reciprocal Rank Fusion: <code>RRF = 1/(60 + r_vec) + 1/(60 + r_fts)</code>.
            </p>
            <div class="vector-search-bar">
              <input
                type="search"
                id="vector-live-input"
                class="rail-search"
                value="${esc(state.vectorFilterQuery)}"
                placeholder="Test live RRF ranking (e.g., RAC 1, PDIS-2622, Titanium, 600 PSIG)..."
              />
            </div>
          </div>

          ${scoredChunks
            .map(
              (chk, idx) => `
                <div class="chunk-card">
                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                    <div style="display: flex; align-items: center; gap: 7px; min-width: 0;">
                      <span class="rac-pill rac-4">#${idx + 1}</span>
                      <code style="font-weight: 700; font-size: 12px; color: var(--text-primary);">${esc(chk.concept)}</code>
                    </div>
                    <span class="mono" style="font-size: 10.5px; color: var(--text-muted);">${esc(chk.pdf)}</span>
                  </div>

                  <div style="font-size: 11.5px; font-weight: 600; color: var(--brand-primary);">
                    ${esc(chk.section)}
                  </div>

                  <div style="font-size: 12px; color: var(--text-secondary); line-height: 1.5;">
                    ${esc(chk.snippet)}
                  </div>

                  <div class="score-bars-row">
                    <div class="score-metric">
                      <div class="score-metric-top">
                        <span>Vector Sim</span>
                        <strong>${chk.vecScore.toFixed(3)}</strong>
                      </div>
                      <div class="score-track">
                        <div class="score-fill-vec" style="width: ${Math.round(chk.vecScore * 100)}%;"></div>
                      </div>
                    </div>
                    <div class="score-metric">
                      <div class="score-metric-top">
                        <span>FTS Token</span>
                        <strong>${chk.ftsScore.toFixed(3)}</strong>
                      </div>
                      <div class="score-track">
                        <div class="score-fill-fts" style="width: ${Math.round(chk.ftsScore * 100)}%;"></div>
                      </div>
                    </div>
                    <div class="score-metric">
                      <div class="score-metric-top">
                        <span>RRF Fused</span>
                        <strong>${chk.rrfScore.toFixed(4)}</strong>
                      </div>
                      <div class="score-track">

                      </div>
                    </div>

              `
            )

      /**
       * Core 4–5s Simulated Thinking & Tool Call Orchestrator
       */
      function executeScenario(scenario, customQuestionText = null) {
        if (state.isThinking) return;
        clearActiveTimers();

        state.isThinking = true;
        state.activeScenarioId = scenario.id;
        dom.btnSendQuery.disabled = true;
        renderScenarioStrip();

        // Remove welcome hero on first query
        const welcome = document.getElementById("welcome-hero");
        if (welcome) welcome.remove();

        const displayedQuestion = customQuestionText || scenario.question;
        const totalMs = scenario.durationMs || 4500;

        // 1. Append User Bubble
        const userEl = document.createElement("div");
        userEl.className = "msg-user";
        userEl.innerHTML = `
          <div class="msg-user-meta">
            <span>Lead Process Engineer</span>
            <span>Context: ${esc(scenario.focusAsset)}</span>
          </div>
          <div class="msg-user-text">${esc(displayedQuestion)}</div>
        `;
        dom.chatStream.appendChild(userEl);

        // 2. Append Agent Turn Wrapper with Live Thinking & Tool Trace Card
        const turnId = "turn-" + Date.now();
        const wrapEl = document.createElement("div");
        wrapEl.className = "msg-agent-wrap";
        wrapEl.id = turnId;

        wrapEl.innerHTML = `
          <div class="thinking-card" id="${turnId}-thinking">
            <div class="thinking-progress-track">
              <div class="thinking-progress-fill" id="${turnId}-prog"></div>
            </div>
            <div class="thinking-header" id="${turnId}-hdr" title="Click to expand/collapse reasoning and ADK tool trace">
              <div class="thinking-header-left">
                <span class="spinner-ring" id="${turnId}-icon"></span>
                <span class="thinking-status-title" id="${turnId}-status">
                  Model Armor Guardrail &amp; Intent Framing...
                </span>
              </div>
              <div class="thinking-header-right">
                <span class="thinking-timer" id="${turnId}-timer">0.1s</span>
                <span class="thinking-chevron">▾</span>
              </div>
            </div>
            <div class="thinking-body" id="${turnId}-body">
              <div class="thought-bubble" id="${turnId}-thought" style="display: none;">
                <strong>🧠 Cognitive Plan (gemini-3.8-flash):</strong><br/>
                <span>${esc(scenario.thought)}</span>
              </div>
              <div class="tool-call-list" id="${turnId}-tools">
                <div class="tool-call-row running" id="${turnId}-guardrail">
                  <div class="tool-call-main">
                    <div class="tool-call-title-line">
                      <span class="tool-fn-name">before_agent_callback (Model Armor)</span>
                      <span class="tool-engine-tag">Security Hook</span>
                    </div>
                    <div class="tool-args-code">Inspecting prompt safety &amp; canonical MECE intent routing</div>
                  </div>
                  <div class="tool-call-status" id="${turnId}-guardrail-stat">⏳ Running...</div>
                </div>
                ${scenario.tools
                  .map(
                    (t, idx) => `
                      <div class="tool-call-row pending" id="${turnId}-tool-${idx}">
                        <div class="tool-call-main">
                          <div class="tool-call-title-line">
                            <span class="tool-fn-name">🔧 ${esc(t.name)}</span>
                            <span class="tool-engine-tag">${esc(t.engine)}</span>
                          </div>
                          <div class="tool-args-code">${esc(t.args)}</div>
                        </div>
                        <div class="tool-call-status" id="${turnId}-tool-stat-${idx}">Queued</div>
                      </div>
                    `
                  )
                  .join("")}
              </div>
            </div>
          </div>
          <div id="${turnId}-answer-slot"></div>
        `;

        dom.chatStream.appendChild(wrapEl);
        dom.chatStream.scrollTop = dom.chatStream.scrollHeight;

        const cardEl = document.getElementById(`${turnId}-thinking`);
        const progEl = document.getElementById(`${turnId}-prog`);
        const iconEl = document.getElementById(`${turnId}-icon`);
        const statusEl = document.getElementById(`${turnId}-status`);
        const timerEl = document.getElementById(`${turnId}-timer`);
        const thoughtEl = document.getElementById(`${turnId}-thought`);
        const hdrEl = document.getElementById(`${turnId}-hdr`);

        hdrEl.addEventListener("click", () => {
          cardEl.classList.toggle("collapsed-trace");
        });

        const startTs = performance.now();

        // Smooth 100ms ticker for progress bar & elapsed time
        const tickInterval = setInterval(() => {
          const elapsed = performance.now() - startTs;
          const pct = Math.min(100, (elapsed / totalMs) * 100);
          if (progEl) progEl.style.width = `${pct.toFixed(1)}%`;
          if (timerEl) timerEl.textContent = `${(Math.min(elapsed, totalMs) / 1000).toFixed(1)}s`;
          if (elapsed >= totalMs) {
            clearInterval(tickInterval);
          }
        }, 90);
        state.timers.push(tickInterval);

        // Step A (380ms): Complete Model Armor & reveal Cognitive Reasoning Thought
        state.timers.push(
          setTimeout(() => {
            const grRow = document.getElementById(`${turnId}-guardrail`);
            const grStat = document.getElementById(`${turnId}-guardrail-stat`);
            if (grRow) {
              grRow.classList.remove("running");
              grRow.classList.add("done");
            }
            if (grStat) grStat.textContent = "✓ 142 ms • Safe";
            if (thoughtEl) thoughtEl.style.display = "block";
            if (statusEl) statusEl.textContent = "Thinking & Planning Spanner Tool Trajectory...";
            dom.chatStream.scrollTop = dom.chatStream.scrollHeight;
          }, 380)
        );

        // Step B: Trigger each ADK FunctionTool sequentially across the 4.5s window
        scenario.tools.forEach((tool, idx) => {
          state.timers.push(
            setTimeout(() => {
              const row = document.getElementById(`${turnId}-tool-${idx}`);
              const stat = document.getElementById(`${turnId}-tool-stat-${idx}`);
              if (row) {
                row.classList.remove("pending");
                row.classList.add("running");
              }
              if (stat) stat.textContent = "⏳ Querying...";
              if (statusEl) statusEl.textContent = `Calling ${tool.name} (${tool.engine})...`;
              dom.chatStream.scrollTop = dom.chatStream.scrollHeight;
            }, tool.startMs)
          );

          state.timers.push(
            setTimeout(() => {
              const row = document.getElementById(`${turnId}-tool-${idx}`);
              const stat = document.getElementById(`${turnId}-tool-stat-${idx}`);
              const dur = tool.endMs - tool.startMs;
              if (row) {
                row.classList.remove("running");
                row.classList.add("done");
              }
              if (stat) stat.textContent = `✓ ${dur} ms • ${tool.resultSummary}`;
              if (idx === scenario.tools.length - 1 && statusEl) {
                statusEl.textContent = "Synthesizing Grounded Engineering Response...";
              }
            }, tool.endMs)
          );
        });

        // Step C (totalMs ~4.5s): Finalize Thinking Card, Sync Right Studio & Render Answer
        state.timers.push(
          setTimeout(() => {
            clearInterval(tickInterval);
            if (progEl) progEl.style.width = "100%";
            if (cardEl) cardEl.classList.add("completed");
            if (iconEl) {
              iconEl.outerHTML = `<span class="done-check-icon">✓</span>`;
            }
            const secStr = (totalMs / 1000).toFixed(2);
            if (statusEl) {
              statusEl.textContent = `Reasoning & ${scenario.tools.length} ADK Tool Calls Completed (${
                scenario.tools.map((t) => t.name).join(", ")
              })`;
            }
            if (timerEl) timerEl.textContent = `${secStr}s`;

            // Sync Right Context Studio to matching Asset, Graph Overlay & Tab
            if (scenario.id === "q3-hazop") {
              state.vectorFilterQuery = "Risk Assessment Matrix Severity I-IV RAC 1-4 RH-E-9A Safeguards";
            } else if (scenario.id === "q6-vector") {
              state.vectorFilterQuery = "PDIS-2622 F-33 differential pressure fouling tube plugging 40%";
            }
            setGraphMode(scenario.graphMode || "topology");
            selectAsset(scenario.focusAsset, scenario.targetStudioTab);

            // Render Answer HTML
            const slotEl = document.getElementById(`${turnId}-answer-slot`);
            if (slotEl) {
              slotEl.innerHTML = `<div class="answer-card">${scenario.renderAnswerHtml()}</div>`;
              slotEl.querySelectorAll("[data-jump-tab]").forEach((btn) => {
                btn.addEventListener("click", () => {
                  setStudioTab(btn.getAttribute("data-jump-tab"));
                });
              });
            }

            state.isThinking = false;
            dom.btnSendQuery.disabled = false;
            renderScenarioStrip();
            dom.chatStream.scrollTop = dom.chatStream.scrollHeight;
          }, totalMs)
        );
      }

      /**
       * Free-Form Custom Question Router (maps any typed question to grounded data)
       */
      function handleCustomQuestion(rawText) {
        const lower = rawText.toLowerCase();

        // Match closest scenario or synthesize dynamic equipment lookup
        if (lower.includes("hazop") || lower.includes("risk") || lower.includes("rac") || lower.includes("safeguard")) {
          executeScenario(DEMO_SCENARIOS[2], rawText);
          return;
        }
        if (lower.includes("blast") || lower.includes("fail") || lower.includes("trip") || lower.includes("impact")) {
          executeScenario(DEMO_SCENARIOS[3], rawText);
          return;
        }
        if (lower.includes("upstream") || lower.includes("downstream") || lower.includes("connect") || lower.includes("trace") || lower.includes("hop")) {
          executeScenario(DEMO_SCENARIOS[1], rawText);
          return;
        }
        if (lower.includes("lineage") || lower.includes("source") || lower.includes("pdf") || lower.includes("conflict") || lower.includes("provenance")) {
          executeScenario(DEMO_SCENARIOS[4], rawText);
          return;
        }
        if (lower.includes("foul") || lower.includes("manual") || lower.includes("f-33") || lower.includes("pdis") || lower.includes("vector")) {
          executeScenario(DEMO_SCENARIOS[5], rawText);
          return;
        }

        // Check if a specific asset tag was mentioned; otherwise use activeAssetId
        let targetId = state.activeAssetId;
        Object.keys(ASSETS).forEach((k) => {
          if (lower.includes(k.toLowerCase())) targetId = k;
        });

        const asset = ASSETS[targetId] || ASSETS["RH-E-9A"];
        const dynamicScenario = {
          id: "custom-query",
          focusAsset: asset.id,
          targetStudioTab: "catalog",
          graphMode: "topology",
          durationMs: 4400,
          thought: `Analyzing custom engineering query against active context (${asset.id}). Executing Spanner SQL entity parameter lookup and Hybrid Vector + TOKENLIST RRF search to synthesize a 100% grounded answer.`,
          tools: [
            {
              name: "lookup_entity_and_parameters",
              engine: "Spanner SQL",
              args: `entity_tag_or_id="${asset.id}"`,
              startMs: 420,
              endMs: 2100,
              resultSummary: `${asset.parameters.length} governing facts retrieved`,
            },
            {
              name: "hybrid_search_okf_spanner",
              engine: "Vector 768-d + RRF",
              args: `query="${rawText.slice(0, 52)}", top_k=5`,
              startMs: 2100,
              endMs: 4050,
              resultSummary: "5 OKF section chunks ranked via RRF (k=60)",
            },
          ],
          renderAnswerHtml: () => `
            <div class="answer-top-bar">
              <div class="answer-title-cluster">
                <span class="answer-badge">✓ Grounded Spanner Synthesis</span>
                <span class="badge-xs badge-neutral">Entity: ${esc(asset.id)}</span>
              </div>
              <button type="button" class="studio-jump-btn" data-jump-tab="catalog">
                🏛️ Open ${esc(asset.id)} in Catalog →
              </button>
            </div>
            <div class="ans-body">
              <h3>Grounded Retrieval Summary — <code>${esc(asset.id)}</code> (${esc(asset.name)})</h3>
              <p>${esc(asset.summary)}</p>
              <div class="eng-table-wrap">
                <table class="eng-table">
                  <thead>
                    <tr><th>Parameter</th><th>Value</th><th>Unit</th><th>Source</th></tr>
                  </thead>
                  <tbody>
                    ${asset.parameters
                      .slice(0, 6)
                      .map(
                        (p) => `
                          <tr>
                            <td><strong>${esc(p.name)}</strong></td>
                            <td><code>${esc(p.value)}</code></td>
                            <td class="mono">${esc(p.unit)}</td>
                            <td class="mono">${esc(p.source)}</td>
                          </tr>
                        `
                      )
                      .join("")}
                  </tbody>
                </table>
              </div>
              <p style="font-size: 12px; color: var(--text-muted);">
                Verified by <strong>${esc(asset.governance.approver)}</strong> • Bundle <code>${esc(asset.governance.bundleVersion)}</code> (MD5 <code>${esc(asset.governance.md5)}</code>).
              </p>
            </div>
          `,
        };

        executeScenario(dynamicScenario, rawText);
      }

      /* ======================================================================
         13. INTERACTIVE BINDINGS & INITIALIZATION
         ====================================================================== */
      function bindEvents() {
        // Collapsible Left Rail
        dom.btnToggleSidebar.addEventListener("click", () => {
          state.sidebarCollapsed = !state.sidebarCollapsed;
          dom.assetRail.classList.toggle("collapsed", state.sidebarCollapsed);
        });

        // Theme Toggle
        dom.btnThemeToggle.addEventListener("click", () => {
          setTheme(state.theme === "dark" ? "light" : "dark");
        });

        // Reset Demo
        dom.btnResetDemo.addEventListener("click", () => {
          clearActiveTimers();
          state.isThinking = false;
          state.activeScenarioId = null;
          dom.btnSendQuery.disabled = false;
          setGraphMode("topology");
          selectAsset("RH-E-9A", "graph");
          renderScenarioStrip();
          renderWelcomeScreen();
        });

        // Rail Search & Mode Tabs
        dom.railSearchInput.addEventListener("input", (e) => {
          state.railSearch = e.target.value || "";
          renderAssetRail();
        });

        document.querySelectorAll("[data-rail-mode]").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.querySelectorAll("[data-rail-mode]").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            state.railMode = btn.getAttribute("data-rail-mode");
            renderAssetRail();
          });
        });

        // Right Studio Tabs
        document.querySelectorAll(".studio-tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            setStudioTab(btn.getAttribute("data-studio-tab"));
          });
        });

        // Graph Hop Depth
        document.querySelectorAll("[data-hop]").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.querySelectorAll("[data-hop]").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            state.graphHops = parseInt(btn.getAttribute("data-hop"), 10);
            renderGraph();
          });
        });

        // Graph Visualization Overlay Mode
        document.querySelectorAll("[data-gmode]").forEach((btn) => {
          btn.addEventListener("click", () => {
            setGraphMode(btn.getAttribute("data-gmode"));
          });
        });

        // Graph Edge Filters
        document.querySelectorAll(".edge-filter-cb").forEach((cb) => {
          cb.addEventListener("change", () => {
            if (cb.checked) state.enabledEdges.add(cb.value);
            else state.enabledEdges.delete(cb.value);
            renderGraph();
          });
        });

        // Graph Zoom & Pan
        document.getElementById("btn-zoom-in").addEventListener("click", () => {
          state.zoom = Math.min(2.0, +(state.zoom + 0.18).toFixed(2));
          renderGraph();
        });
        document.getElementById("btn-zoom-out").addEventListener("click", () => {
          state.zoom = Math.max(0.6, +(state.zoom - 0.18).toFixed(2));
          renderGraph();
        });
        document.getElementById("btn-zoom-reset").addEventListener("click", () => {
          state.zoom = 1.0;
          state.panX = 0;
          state.panY = 0;
          renderGraph();
        });

        dom.graphStage.addEventListener("mousedown", (e) => {
          if (e.target.closest("button") || e.target.closest(".graph-inspector-dock")) return;
          state.isPanning = true;
          state.panStartX = e.clientX - state.panX;
          state.panStartY = e.clientY - state.panY;
        });
        window.addEventListener("mousemove", (e) => {
          if (!state.isPanning) return;
          state.panX = e.clientX - state.panStartX;
          state.panY = e.clientY - state.panStartY;
          dom.graphViewport.setAttribute(
            "transform",
            `translate(${state.panX}, ${state.panY}) scale(${state.zoom})`
          );
        });
        window.addEventListener("mouseup", () => {
          state.isPanning = false;
        });

        // Chat Form Submit & Enter Shortcut
        dom.chatForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const text = dom.chatInput.value.trim();
          if (!text || state.isThinking) return;
          dom.chatInput.value = "";
          handleCustomQuestion(text);
        });

        dom.chatInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            dom.chatForm.requestSubmit();
          }
        });
      }

      function init() {
        bindEvents();
        setTheme("light");
        selectAsset("RH-E-9A", "graph");
        renderScenarioStrip();
        renderWelcomeScreen();
      }

      init();
    })();
  </script>
</body>
